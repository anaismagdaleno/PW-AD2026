<!DOCTYPE html>
<html>
    <head>
      <meta charset="UTF-8">
     <title>EJEMPLO GRID</title>
     <style>
        .contenedor{
            display: grid;
            grid-template-columns: repeat(3, 1fr 2fr);
            gap: 10px
        }
        .caja{
            background-color: blueviolet;
            color: white;
            padding: 30px;
            text-align: center;
            font-size: 24px;
            border-radius: 8px;

        }
        </style>
    </head>
    <body>
     <h1>EJEMPLO GRID</h1>
     <div CLASS="contenedor">
        <div class="caja">
            <h6>Nombre Producto</h6>
            <img>
            <p>Descripcion</p>
        </div>
        <div class="caja">2</div>
        <div class="caja">3</div>
        <div class="caja">4</div>
        <div class="caja">5</div>
        <div class="caja">6</div>

    </div>
     </body>
</html>
